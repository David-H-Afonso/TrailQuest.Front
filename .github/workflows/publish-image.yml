name: Publish web image manually
on:
  workflow_dispatch:
    inputs:
      confirm_third_party_terms:
        description: I reviewed dependency, font and React Leaflet terms for this distribution.
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Require reviewed immutable version tag
        env:
          TERMS_REVIEWED: ${{ inputs.confirm_third_party_terms }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$TERMS_REVIEWED" == true ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == "v$version" ]]
          echo "version=$version" >> "$GITHUB_ENV"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trailquest-web" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: 24.22.2, cache: npm}
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm run test
      - run: npm run test:runtime
      - run: npm audit --audit-level=high
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build local candidate before publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: trailquest-web:release-check
          build-args: |
            RELEASE_VERSION=${{ env.version }}
            SOURCE_REVISION=${{ github.sha }}
      - name: Block vulnerable or secret-bearing candidate
        run: bash scripts/scan-image.sh trailquest-web:release-check
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ensure-new-image-tag.sh trailquest-web "$version"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.image }}:${{ env.version }}
          build-args: |
            RELEASE_VERSION=${{ env.version }}
            SOURCE_REVISION=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record release identity
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Web image: `%s@%s`\nSource: `%s`\n' "$image" "$IMAGE_DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: web-release-security-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
