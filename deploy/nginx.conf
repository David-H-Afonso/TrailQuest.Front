worker_processes auto;
pid /tmp/trailquest/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    log_format safe escape=json '{"time":"$time_iso8601","peer":"$realip_remote_addr","method":"$request_method","path":"$uri","status":$status,"request_id":"$request_id"}';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/trailquest/client_temp;
    proxy_temp_path /tmp/trailquest/proxy_temp;
    fastcgi_temp_path /tmp/trailquest/fastcgi_temp;
    uwsgi_temp_path /tmp/trailquest/uwsgi_temp;
    scgi_temp_path /tmp/trailquest/scgi_temp;
    include /tmp/trailquest/conf.d/*.conf;
}
